<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>İzin Reddedildi</title></head>
<body style="font-family:Arial,sans-serif;background:#f4f6f9;padding:24px;">
  <div style="max-width:560px;margin:auto;background:#fff;border-radius:8px;padding:32px;">
    <h2 style="color:#e02424;margin-top:0;">✕ İzin Talebiniz Reddedildi</h2>
    <p>Sayın <strong>{{ calisan }}</strong>,</p>
    <p><strong>{{ izin_turu }}</strong> talebiniz reddedilmiştir.</p>
    {% if ret_nedeni %}
    <div style="background:#fff5f5;border-left:4px solid #e02424;padding:12px 16px;margin-top:16px;">
      <strong>Red Nedeni:</strong><br>{{ ret_nedeni }}
    </div>
    {% endif %}
    <div style="margin-top:24px;">
      <a href="http://localhost:3000/inpulse/leave" style="background:#1a56db;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none;">
        Yeni Talep Oluştur
      </a>
    </div>
    <p style="color:#6b7280;font-size:12px;margin-top:24px;">İSO Pulse — Inpulse İzin Sistemi</p>
  </div>
</body>
</html>
