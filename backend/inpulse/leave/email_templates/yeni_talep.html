<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>Yeni İzin Talebi</title></head>
<body style="font-family:Arial,sans-serif;background:#f4f6f9;padding:24px;">
  <div style="max-width:560px;margin:auto;background:#fff;border-radius:8px;padding:32px;">
    <h2 style="color:#1a56db;margin-top:0;">Yeni İzin Talebi</h2>
    <p><strong>{{ calisan }}</strong> adlı çalışan izin talebinde bulundu.</p>
    <table style="border-collapse:collapse;width:100%;margin-top:16px;">
      <tr style="background:#f8fafc;">
        <td style="padding:8px 12px;font-weight:600;">İzin Türü</td>
        <td style="padding:8px 12px;">{{ izin_turu }}</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:600;">Çıkış Tarihi</td>
        <td style="padding:8px 12px;">{{ cikis }}</td>
      </tr>
      <tr style="background:#f8fafc;">
        <td style="padding:8px 12px;font-weight:600;">Giriş Tarihi</td>
        <td style="padding:8px 12px;">{{ giris }}</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;font-weight:600;">Süre</td>
        <td style="padding:8px 12px;">{{ sure }} iş günü</td>
      </tr>
    </table>
    <div style="margin-top:24px;">
      <a href="http://localhost:3000/inpulse/manager" style="background:#1a56db;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none;">
        Talebi İncele
      </a>
    </div>
    <p style="color:#6b7280;font-size:12px;margin-top:24px;">İSO Pulse — Inpulse İzin Sistemi</p>
  </div>
</body>
</html>
